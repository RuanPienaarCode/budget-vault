# A tag push (no 'v' prefix) triggers this. Why each part is load-bearing:
#   - permissions: contents:write creates the release; id-token + attestations mint provenance.
#   - "Verify tag matches manifest version": Obsidian matches the release tag to manifest.version
#     EXACTLY. This step fails the run before publishing a mismatched tag, so you never ship a
#     release Obsidian can't find.
#   - attest-build-provenance@v4: lets anyone run `gh attestation verify main.js -R owner/repo`.
#   - gh release create with the three raw assets: manifest.json + main.js + styles.css as
#     individual files, never a zip and never the auto source archive.
name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Required to mint build-provenance attestations for the release assets.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 — SHA-pinned: this workflow mints provenance attestations with contents:write, so a moving tag is the one thing in it that could change without review

      # main.js is a committed build artifact and this workflow publishes the
      # COMMITTED file — so a src/ change released without rebuilding would ship
      # a stale bundle with nothing to catch it. Rebuild and diff.
      #
      # `npm ci`, not `npm install`: it installs EXACTLY package-lock.json. That
      # is what makes the rebuild reproducible, and it is the same path
      # Obsidian's scorecard takes when it clones this repo to verify the
      # release build against the published main.js. The bundler version is
      # pinned in the lockfile, so the byte comparison below cannot be broken by
      # a floating upgrade — a false alarm that would look identical to a real
      # stale bundle.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5 — SHA-pinned, same reason as checkout
        with:
          node-version: "22"
          cache: "npm"

      - name: Rebuild and verify the committed bundle is current
        run: |
          npm ci
          ./build.sh
          if ! git diff --exit-code -- main.js; then
            echo "main.js does not match src/ — run ./build.sh and commit the result." >&2
            echo "If bun was upgraded locally, pin the new version in this workflow too." >&2
            exit 1
          fi
          # styles.css is build output too: src/styles.css concatenated with the
          # generated src/styles-presets.css. Without this check a stale committed
          # stylesheet would ship palettes that no longer match their seeds, with
          # the main.js check above passing happily alongside it.
          if ! git diff --exit-code -- styles.css src/styles-presets.css; then
            echo "styles.css / src/styles-presets.css do not match their sources —" >&2
            echo "run ./build.sh and commit the result." >&2
            exit 1
          fi

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST_VERSION=$(jq -r .version manifest.json)
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag '$TAG' does not match manifest version '$MANIFEST_VERSION'." >&2
            echo "Obsidian matches releases to the manifest version exactly — no 'v' prefix." >&2
            exit 1
          fi
          # versions.json maps plugin version -> minAppVersion. Obsidian reads it
          # to decide which release an older app is allowed to install; a missing
          # entry silently strands users on the previous version.
          if ! jq -e --arg v "$MANIFEST_VERSION" 'has($v)' versions.json >/dev/null; then
            echo "versions.json has no entry for '$MANIFEST_VERSION'." >&2
            exit 1
          fi

      # Lets anyone verify the shipped assets came from this repo and this
      # workflow: `gh attestation verify main.js -R RuanPienaarCode/budget-vault`
      - name: Attest release assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4 — SHA-pinned (peeled commit of the annotated tag), same reason as checkout
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --generate-notes \
            main.js manifest.json styles.css
